# Proyecto 14 — Limpieza de disco segura: cachés, temporales y artefactos de build.
[package]
name = "limpieza-disco"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[[bin]]
name = "limpiar"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
