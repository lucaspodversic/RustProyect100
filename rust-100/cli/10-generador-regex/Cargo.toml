# Proyecto 10 — Generador de expresiones regulares a partir de ejemplos (inspirado en grex).
[package]
name = "generador-regex"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"   # se usa para VERIFICAR que la regex generada acepta todos los ejemplos
