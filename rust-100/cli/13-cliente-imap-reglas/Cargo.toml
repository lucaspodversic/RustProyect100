# Proyecto 13 — Cliente de correo IMAP con reglas de filtrado automáticas.
[package]
name = "cliente-imap-reglas"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[[bin]]
name = "imapreglas"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
