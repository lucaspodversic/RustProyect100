# Proyecto 07 — Benchmark HTTP concurrente (tipo wrk/hey simplificado).
[package]
name = "benchmark-http"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
