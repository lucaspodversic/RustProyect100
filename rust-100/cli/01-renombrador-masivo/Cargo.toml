# Proyecto 01 — Renombrador masivo de archivos con regex y previsualización.
[package]
name = "renombrador-masivo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Renombra archivos en lote usando expresiones regulares, con modo de previsualización (dry-run)."

[dependencies]
clap = { version = "4.5", features = ["derive"] }   # parsing de argumentos de línea de comandos
regex = "1"                                          # motor de expresiones regulares

[dev-dependencies]
tempfile = "3"   # directorios temporales para los tests
