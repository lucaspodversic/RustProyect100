# Proyecto 09 — Gestor de tareas (To-Do) en CLI con persistencia en JSON.
[package]
name = "todo-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
