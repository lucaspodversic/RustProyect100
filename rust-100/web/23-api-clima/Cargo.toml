# Proyecto 23 — API de clima: cliente HTTP externo (Open-Meteo) mockeable + caché con TTL.
[package]
name = "api-clima"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cliente HTTP. rustls (sin OpenSSL del sistema) para HTTPS real.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
