# Proyecto 17 — Acortador de URLs con redirección y estadísticas básicas.
[package]
name = "acortador-urls"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
url = "2"   # validación/normalización de URLs

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
