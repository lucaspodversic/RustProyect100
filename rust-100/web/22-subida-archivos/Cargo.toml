# Proyecto 22 — Servicio de subida/descarga de archivos con límites de tamaño y MIME.
[package]
name = "subida-archivos"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tokio-util = { version = "0.7", features = ["io"] }   # ReaderStream: archivo → stream de bytes

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
