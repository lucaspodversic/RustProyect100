# Backend Axum: API REST de notas + página inicial renderizada con Yew (SSR).
[package]
name = "backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
compartido = { path = "../compartido" }
frontend = { path = "../frontend" }   # feature "ssr" por defecto
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = "1"
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }   # sirve /pkg (WASM compilado)

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
