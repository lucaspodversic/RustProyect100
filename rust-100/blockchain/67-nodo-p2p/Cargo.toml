# Proyecto 67 — Nodo P2P que sincroniza bloques con sus pares.
[package]
name = "nodo-p2p"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Nodo blockchain con protocolo de sincronización por TCP (JSON por líneas) y simulación en proceso."
license = "MIT"

[dependencies]
sha2 = "0.10"
hex = "0.4"
# Serialización de mensajes del protocolo.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
