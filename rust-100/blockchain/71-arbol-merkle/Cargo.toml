# Proyecto 71 — Árbol de Merkle para verificación de transacciones.
[package]
name = "arbol-merkle"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Árbol de Merkle con dos modos (RFC 6962 seguro y compatible Bitcoin), pruebas de inclusión y verificación SPV."
license = "MIT"

[dependencies]
sha2 = "0.10"
hex = "0.4"
